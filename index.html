<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice</title>
    <link rel="stylesheet" href="./styles.css" />
    <link
      rel="stylesheet"
      href="./md.css"
      media="all and (min-width: 768px) and (max-width: 1023.98px)"
    />
    <link
      rel="stylesheet"
      href="./lg.css"
      media="all and (min-width: 1024px)"
    />
  </head>
  <body>
    <h1>Food Ordering Website</h1>
    <div class="line">
      <img src="./assets/line.svg" alt="line" />
    </div>

    <div class="main-content">
      <nav class="nav-bar">
        <img src="./assets/logo.svg" alt="logo" class="logo" />
        <ul class="top-bar">
          <li>Today Special Offers</li>
          <li>Why FoodHut</li>
          <li>Our Menu</li>
          <li>Our Popular Food</li>
        </ul>
        <a type="button" href="" class="btn">Download App</a>
        <button class="nav-hamburger" aria-label="hamburger icon">
          <img
            class="nav-hamburger-icon"
            src="./assets/hamburger-icon.svg"
            alt="hamburger icon"
            aria-hidden="true"
          />
        </button>
      </nav>
      <div class="top-content">
        <section class="left-top-content">
          <div class="icon-span">
            <img
              src="./assets/heart-svgrepo-com.svg"
              alt="heart"
              class="icons"
            />
            <span class="paragraph">People trust us</span>
          </div>
          <h1>We're <span class="red-text">Serious</span> For <span class="red-text">Food</span> & <span class="orange-text">Delivery</span>. </h1>
          <p class="paragraph">Best cooks and best delivery guys all at your service. Hot tasty food will reach you in 60 minutes!</p>

          <form action="" method="GET">
          <input
            type="text"
            placeholder="  Search food"
            name="search"
            aria-label="search"
            class="form-input"
          />
          <button type="submit">
            <img
              class="icons"
              src="./assets/search-icon.svg"
              alt="Search"
            />
          </button>
        </form>
        <div class="video-img">
          <img class="icons" src="./assets/video-icon.svg" alt="video icon">
          <a href="#"></a>Watch Video</a>
        </div>

        </section>
        <section class="right-top-content"></section>
      </div>
    </div>
  </body>
</html>
